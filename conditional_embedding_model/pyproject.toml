[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional_embedding_model"
version = "0.1.0"
description = "Conditional embedding model package"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "torchaudio",
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "tqdm",
  "wandb",
  "pillow",
  "opencv-python",
  "torchinfo",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
